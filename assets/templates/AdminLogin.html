{% extends 'base.html' %}
{% load static %}
{% block contents %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

<section class="login-section py-5" style="background: #eef2f7;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card login-card shadow-lg border-0 animate__animated animate__fadeIn rounded-4">
                    <!-- Header -->
                    <div class="card-header bg-gradient text-white text-center py-4 rounded-top-4">
                        <h2 class="mb-1" style="font-weight: 700;">
                            <i class="fas fa-user-cog me-2"></i>       Admin Login
                        </h2>
                        <p class="mb-0 small opacity-75">Access your administrative panel</p>
                    </div>

                    <!-- Body -->
                    <div class="card-body p-5 bg-white">
                        <form action="{% url 'AdminLoginCheck' %}" method="POST" class="needs-validation" novalidate>
                            {% csrf_token %}

                            <!-- Login ID -->
                            <div class="position-relative mb-4">
                                <input type="text" class="form-control custom-input" name="loginid" id="loginid" placeholder=" " required>
                                <label class="form-label-icon" for="loginid">
                                    <i class="fas fa-id-badge"></i> Login ID
                                </label>
                                <div class="invalid-feedback">Please enter your login ID</div>
                            </div>

                            <!-- Password -->
                            <div class="position-relative mb-4">
                                <input type="password" class="form-control custom-input password-input" name="pswd" id="pswd" placeholder=" " required>
                                <label class="form-label-icon" for="pswd">
                                    <i class="fas fa-lock"></i> Password
                                </label>
                                <span class="toggle-password"><i class="fas fa-eye"></i></span>
                                <div class="invalid-feedback">Please enter your password</div>
                            </div>

                            <!-- Buttons -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                                <button type="submit" class="btn btn-primary px-5 py-3 fw-bold shadow rounded-pill">
                                    <i class="fas fa-sign-in-alt me-2"></i>      Login
                                </button>
                            </div>

                            <!-- Messages -->
                            {% if messages %}
                            <div class="mt-4">
                                {% for message in messages %}
                                <div class="alert alert-{{ message.tags|default:"info" }} alert-dismissible fade show d-flex align-items-center rounded" role="alert">
                                    <i class="fas {% if message.tags == 'success' %}fa-check-circle{% elif message.tags == 'error' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %} me-2"></i>
                                    <div>{{ message }}</div>
                                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                                {% endfor %}
                            </div>
                            {% endif %}
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Styles -->
<style>
    .bg-gradient {
        background: linear-gradient(135deg, #4e73df, #224abe);
    }
    .d-grid button {
        margin-left: 25px;
        width: 90%;
    }

    .login-card {
        border-radius: 30px !important;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    .custom-input {
        border-radius: 15px;
        border: 1px solid #ced4da;
        padding: 0.8rem 1.25rem;
        background-color: rgba(255, 255, 255, 0.95);
        transition: all 0.3s ease;
    }

    .custom-input:focus {
        border-color: #4e73df;
        box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
    }

    .form-label-icon {
        position: absolute;
        top: -0.7rem;
        left: 0.75rem;
        background: #fff;
        padding: 0 0.5rem;
        font-size: 0.85rem;
        color: #495057;
        font-weight: 500;
    }

    .toggle-password {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6c757d;
    }

    .toggle-password:hover {
        color: #495057;
    }

    .btn {
        border-radius: 50px !important;
    }

    .alert {
        border-radius: 12px;
    }
</style>

<!-- Script -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.querySelector('.toggle-password');
        toggleBtn.addEventListener('click', function () {
            const input = document.querySelector('#pswd');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        // Bootstrap validation
        const forms = document.querySelectorAll('.needs-validation');
        forms.forEach(form => {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    });
</script>
{% endblock %}
