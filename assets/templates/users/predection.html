{% extends 'users/userbase.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Make Prediction</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="year">Year</label>
                            <input type="number" class="form-control" id="year" name="year" required>
                        </div>
                        <div class="form-group">
                            <label for="month">Month</label>
                            <input type="number" class="form-control" id="month" name="month" required>
                        </div>
                        <div class="form-group">
                            <label for="manpw_cost">Manpower Cost</label>
                            <input type="number" step="0.01" class="form-control" id="manpw_cost" name="manpw_cost" required>
                        </div>
                        <div class="form-group">
                            <label for="material_cost">Material Cost</label>
                            <input type="number" step="0.01" class="form-control" id="material_cost" name="material_cost" required>
                        </div>
                        <div class="form-group">
                            <label for="manag_cost">Management Cost</label>
                            <input type="number" step="0.01" class="form-control" id="manag_cost" name="manag_cost" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Predict</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
